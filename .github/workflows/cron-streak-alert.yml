name: Cron - Streak Alert Email

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron-streak-alert endpoint
        run: |
          curl -sf -X POST "https://codeshelf-vwb9.onrender.com/api/email/cron-streak-alert" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 60
