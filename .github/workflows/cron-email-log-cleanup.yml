name: Cron - Email Log Cleanup

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron-cleanup endpoint
        run: |
          curl -sf -X POST "https://codeshelf-vwb9.onrender.com/api/email/cron-cleanup" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 60
