name: Cron - Daily Revision Email

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron-daily endpoint
        run: |
          curl -sf -X POST "https://codeshelf-vwb9.onrender.com/api/email/cron-daily" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 60
