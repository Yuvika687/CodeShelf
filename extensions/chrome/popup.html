<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeShelf Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="logo">&lt;/&gt;</div>
        <div>
          <h1>CodeShelf Capture</h1>
          <p>Save practice without leaving the problem page.</p>
        </div>
      </header>

      <section class="panel">
        <h2>Connection</h2>
        <p id="connectionState">Connect your CodeShelf account once. No API URL or token paste needed.</p>
        <button id="connectCodeShelf">Connect CodeShelf</button>
      </section>

      <section class="panel">
        <h2>Capture</h2>
        <div id="capturePreview" class="preview">Open a LeetCode problem and click capture.</div>
        <button id="capturePage">Capture current page</button>
        <button id="saveCodeShelf">Save to CodeShelf</button>
      </section>

      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
