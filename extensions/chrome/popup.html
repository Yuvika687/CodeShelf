<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeShelf Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="logo">&lt;/&gt;</div>
        <div>
          <h1>CodeShelf Capture</h1>
          <p>Save practice without leaving the problem page.</p>
        </div>
      </header>

      <section class="panel">
        <h2>Connection</h2>
        <label>CodeShelf API URL<input id="apiBase" placeholder="https://your-api.onrender.com/api" /></label>
        <label>CodeShelf JWT<input id="jwt" type="password" placeholder="Paste your CodeShelf token" /></label>
        <button id="saveSettings">Save connection</button>
      </section>

      <section class="panel github">
        <h2>GitHub authorization</h2>
        <p>Use a fine-grained token with Contents read/write for your solution repo.</p>
        <label>GitHub token<input id="githubToken" type="password" placeholder="ghp_..." /></label>
        <label>Repo<input id="githubRepo" placeholder="username/codeshelf-solutions" /></label>
        <label>Branch<input id="githubBranch" placeholder="main" /></label>
        <a id="tokenLink" href="https://github.com/settings/tokens/new?description=CodeShelf%20Capture&scopes=repo" target="_blank" rel="noreferrer">Authorize on GitHub</a>
      </section>

      <section class="panel">
        <h2>Capture</h2>
        <div id="capturePreview" class="preview">Open a LeetCode problem and click capture.</div>
        <button id="capturePage">Capture current page</button>
        <button id="saveCodeShelf">Save to CodeShelf</button>
        <button id="commitGithub">Commit to GitHub</button>
      </section>

      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
