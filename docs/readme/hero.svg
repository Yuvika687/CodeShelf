<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="CodeShelf — never forget what you already learned. A spaced-repetition memory engine for developers.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060F"/>
      <stop offset=".55" stop-color="#0B0A1F"/>
      <stop offset="1" stop-color="#06121A"/>
    </linearGradient>
    <radialGradient id="nebA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EC4899" stop-opacity=".28"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset=".6" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#2E1065"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="460" rx="22"/></clipPath>
    <clipPath id="typeClip">
      <rect x="92" y="268" height="34" width="0">
        <animate attributeName="width" dur="16s" repeatCount="indefinite"
          values="0;560;560;0;0;560;560;0;0;560;560;0;0;560;560;0"
          keyTimes="0;.09;.21;.25;.25;.34;.46;.5;.5;.59;.71;.75;.75;.84;.96;1"/>
      </rect>
    </clipPath>
    <style>
      .s{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
      .tw{animation:tw 4s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
      .drift{animation:drift 18s ease-in-out infinite alternate}
      @keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,-25px)}}
      .drift2{animation:drift2 22s ease-in-out infinite alternate}
      @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-70px,30px)}}
      .spin{transform-origin:1010px 230px;animation:spin 26s linear infinite}
      .spinR{transform-origin:1010px 230px;animation:spin 40s linear infinite reverse}
      .spinF{transform-origin:1010px 230px;animation:spin 12s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pulse{transform-origin:1010px 230px;animation:pulse 3.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.18);opacity:1}}
      .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .dot{animation:dot 1.8s ease-in-out infinite}
      @keyframes dot{0%,100%{opacity:1}50%{opacity:.25}}
      .sweep{animation:sweep 6s ease-in-out infinite}
      @keyframes sweep{0%,60%{transform:translateX(-300px)}100%{transform:translateX(900px)}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="460" fill="url(#bg)"/>
    <rect width="1280" height="460" fill="url(#grid)"/>
    <g class="drift"><ellipse cx="300" cy="120" rx="360" ry="200" fill="url(#nebA)"/></g>
    <g class="drift2"><ellipse cx="1050" cy="380" rx="380" ry="200" fill="url(#nebB)"/></g>
    <g class="drift"><ellipse cx="760" cy="40" rx="260" ry="140" fill="url(#nebC)"/></g>

    <!-- stars -->
    <g fill="#fff">
      <circle class="tw" cx="62" cy="48" r="1.3" style="animation-delay:.2s"/>
      <circle class="tw" cx="190" cy="390" r="1" style="animation-delay:1.4s"/>
      <circle class="tw" cx="420" cy="70" r="1.4" style="animation-delay:2.1s"/>
      <circle class="tw" cx="520" cy="410" r="1.1" style="animation-delay:.8s"/>
      <circle class="tw" cx="640" cy="120" r="1" style="animation-delay:3s"/>
      <circle class="tw" cx="700" cy="350" r="1.5" style="animation-delay:1.1s"/>
      <circle class="tw" cx="790" cy="60" r="1.2" style="animation-delay:2.6s"/>
      <circle class="tw" cx="830" cy="420" r="1" style="animation-delay:.4s"/>
      <circle class="tw" cx="1180" cy="60" r="1.4" style="animation-delay:1.8s"/>
      <circle class="tw" cx="1230" cy="300" r="1.1" style="animation-delay:3.4s"/>
      <circle class="tw" cx="1130" cy="420" r="1.3" style="animation-delay:.9s"/>
      <circle class="tw" cx="880" cy="180" r=".9" style="animation-delay:2.3s"/>
      <circle class="tw" cx="340" cy="250" r=".9" style="animation-delay:1.6s"/>
      <circle class="tw" cx="40" cy="300" r="1.2" style="animation-delay:2.9s"/>
      <circle class="tw" cx="590" cy="230" r=".8" style="animation-delay:.6s"/>
    </g>

    <!-- orbit system -->
    <circle cx="1010" cy="230" r="150" fill="url(#halo)" class="pulse"/>
    <circle cx="1010" cy="230" r="178" fill="none" stroke="#fff" stroke-opacity=".07"/>
    <g class="spinR">
      <circle cx="1010" cy="230" r="178" fill="none" stroke="#2DD4BF" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="2 14"/>
      <circle cx="1188" cy="230" r="5" fill="#2DD4BF"/>
      <circle cx="832" cy="230" r="3.5" fill="#5EEAD4" opacity=".8"/>
    </g>
    <circle cx="1010" cy="230" r="122" fill="none" stroke="#A78BFA" stroke-opacity=".22"/>
    <g class="spin">
      <circle cx="1010" cy="230" r="122" fill="none" stroke="url(#title)" stroke-opacity=".55" stroke-width="2" stroke-dasharray="120 646"/>
      <g transform="translate(1010 108)">
        <circle r="17" fill="#0B0D1F" stroke="#8B5CF6" stroke-opacity=".7"/>
        <text y="5" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#C4B5FD">SQL</text>
      </g>
      <g transform="translate(1132 230)">
        <circle r="17" fill="#0B0D1F" stroke="#2DD4BF" stroke-opacity=".7"/>
        <text y="5" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#5EEAD4">DSA</text>
      </g>
      <g transform="translate(1010 352)">
        <circle r="17" fill="#0B0D1F" stroke="#EC4899" stroke-opacity=".7"/>
        <text y="4" text-anchor="middle" class="m" font-size="10" font-weight="700" fill="#F9A8D4">OPS</text>
      </g>
      <g transform="translate(888 230)">
        <circle r="17" fill="#0B0D1F" stroke="#60A5FA" stroke-opacity=".7"/>
        <text y="4" text-anchor="middle" class="m" font-size="10" font-weight="700" fill="#93C5FD">SYS</text>
      </g>
    </g>
    <g class="spinF">
      <circle cx="1010" cy="230" r="78" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="1 7"/>
      <circle cx="1088" cy="230" r="3" fill="#F9A8D4"/>
    </g>
    <circle cx="1010" cy="230" r="52" fill="url(#core)" stroke="#C4B5FD" stroke-opacity=".6"/>
    <text x="1010" y="245" text-anchor="middle" class="m" font-size="38" font-weight="800" fill="#fff">&lt;/&gt;</text>

    <!-- copy -->
    <g class="rise" style="animation-delay:.05s">
      <rect x="92" y="62" width="252" height="30" rx="15" fill="#22C55E" fill-opacity=".12" stroke="#22C55E" stroke-opacity=".5"/>
      <circle cx="112" cy="77" r="4.5" fill="#22C55E" class="dot"/>
      <text x="126" y="82" class="m" font-size="12.5" letter-spacing="2" fill="#86EFAC">LIVE · v3.0 · SHIPPED</text>
    </g>
    <g class="rise" style="animation-delay:.15s">
      <text x="88" y="178" class="s" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#title)">CodeShelf</text>
    </g>
    <g class="rise" style="animation-delay:.3s">
      <text x="92" y="226" class="s" font-size="26" font-weight="600" fill="#E5E7FF">Never forget what you already learned.</text>
    </g>

    <!-- typing line -->
    <g class="rise" style="animation-delay:.45s">
      <text x="92" y="292" class="m" font-size="18" fill="#2DD4BF">&gt;</text>
      <g clip-path="url(#typeClip)" transform="translate(22 0)">
        <text x="92" y="292" class="m" font-size="18" fill="#C4B5FD" opacity="0">AI turns your notes into recall cards
          <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.25;.2501;1"/></text>
        <text x="92" y="292" class="m" font-size="18" fill="#C4B5FD" opacity="0">spaced repetition schedules every review
          <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.25;.2501;.5;.5001;1"/></text>
        <text x="92" y="292" class="m" font-size="18" fill="#C4B5FD" opacity="0">revise hands-free in walk mode
          <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.5;.5001;.75;.7501;1"/></text>
        <text x="92" y="292" class="m" font-size="18" fill="#C4B5FD" opacity="0">daily recall sprints land in your inbox
          <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;.75;.7501;1"/></text>
      </g>
    </g>

    <!-- stat strip -->
    <g class="rise" style="animation-delay:.6s" transform="translate(92 336)">
      <g>
        <rect width="132" height="62" rx="12" fill="#0B0D1F" fill-opacity=".65" stroke="#8B5CF6" stroke-opacity=".35"/>
        <text x="16" y="31" class="s" font-size="24" font-weight="800" fill="#fff">66</text>
        <text x="16" y="50" class="m" font-size="10.5" letter-spacing="1.5" fill="#A9AED6">API ENDPOINTS</text>
      </g>
      <g transform="translate(144 0)">
        <rect width="132" height="62" rx="12" fill="#0B0D1F" fill-opacity=".65" stroke="#2DD4BF" stroke-opacity=".35"/>
        <text x="16" y="31" class="s" font-size="24" font-weight="800" fill="#fff">15</text>
        <text x="16" y="50" class="m" font-size="10.5" letter-spacing="1.5" fill="#A9AED6">DB TABLES</text>
      </g>
      <g transform="translate(288 0)">
        <rect width="132" height="62" rx="12" fill="#0B0D1F" fill-opacity=".65" stroke="#EC4899" stroke-opacity=".35"/>
        <text x="16" y="31" class="s" font-size="24" font-weight="800" fill="#fff">4</text>
        <text x="16" y="50" class="m" font-size="10.5" letter-spacing="1.5" fill="#A9AED6">CLIENTS</text>
      </g>
      <g transform="translate(432 0)">
        <rect width="132" height="62" rx="12" fill="#0B0D1F" fill-opacity=".65" stroke="#60A5FA" stroke-opacity=".35"/>
        <text x="16" y="31" class="s" font-size="24" font-weight="800" fill="#fff">16</text>
        <text x="16" y="50" class="m" font-size="10.5" letter-spacing="1.5" fill="#A9AED6">APP SCREENS</text>
      </g>
    </g>

    <!-- light sweep -->
    <g class="sweep" opacity=".08"><rect x="0" y="-40" width="160" height="540" fill="url(#shine)" transform="skewX(-18)"/></g>
  </g>
  <rect x=".5" y=".5" width="1279" height="459" rx="22" fill="none" stroke="#A78BFA" stroke-opacity=".3"/>
</svg>
